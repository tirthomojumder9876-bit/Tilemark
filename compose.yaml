services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app}
      PORT: "3001"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env before starting}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

    # Published on the loopback interface only, so host tools can reach it at
    # 127.0.0.1:5436 while other machines on the network cannot. The app
    # container still connects internally over the compose network as db:5432.
    # Widen to "0.0.0.0:${DB_PORT:-5436}:5432" only if you deliberately want
    # remote access.
    ports:
      - "127.0.0.1:${DB_PORT:-5436}:5432"

volumes:
  dbdata:
